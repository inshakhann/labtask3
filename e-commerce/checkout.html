<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout · Northfield Goods</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body><div id="nav"></div>
<main class="container py-5"><h2 class="mb-4">Checkout</h2><div id="co" class="row g-4"></div></main>
<div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script>
<script>
const u=getUser(),c=getCart();
if(!u){sessionStorage.setItem("next","checkout.html");location.href="login.html"}
else if(!c.length){$("#co").innerHTML='<p>Your cart is empty.</p><a class="btn btn-accent" href="index.html#products">Browse products</a>'}
else{let t=0;const lines=c.map(i=>{const p=PRODUCTS.find(x=>x.id===i.id);t+=p.price*i.qty;return`<li class="list-group-item d-flex justify-content-between">${p.name} × ${i.qty}<span>${money(p.price*i.qty)}</span></li>`}).join("");
$("#co").innerHTML=`<div class="col-lg-7"><form id="f" class="card card-body">
<div class="row g-3"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" value="${u.name}" required></div>
<div class="col-md-6"><label class="form-label">Email</label><input id="e" type="email" class="form-control" value="${u.email}" required></div>
<div class="col-12"><label class="form-label">Address</label><input class="form-control" required></div>
<div class="col-md-6"><label class="form-label">City</label><input class="form-control" required></div>
<div class="col-md-6"><label class="form-label">Postal code</label><input class="form-control" required></div>
<div class="col-12"><label class="form-label">Payment</label><select class="form-select"><option>Cash on delivery</option><option>Card (demo, not charged)</option></select></div>
<div class="col-12"><button class="btn btn-accent btn-lg w-100">Place order · ${money(t)}</button></div></div></form></div>
<div class="col-lg-5"><div class="card"><div class="card-header">Order summary</div><ul class="list-group list-group-flush">${lines}
<li class="list-group-item d-flex justify-content-between fw-bold">Total<span>${money(t)}</span></li></ul></div></div>`;
$("#f").onsubmit=e=>{e.preventDefault();const em=$("#e").value,id="NG-"+Date.now().toString().slice(-6),o=load("orders",[]);o.push({id,user:u.email,items:c,total:t,date:new Date().toISOString()});save("orders",o);
setCart([]);$("#co").innerHTML=`<div class="col-12"><div class="alert alert-success"><h4>Order ${id} placed</h4><p class="mb-0">Thanks, ${u.name.split(" ")[0]}. A confirmation will go to ${em}.</p></div><a class="btn btn-accent" href="index.html">Keep shopping</a></div>`}}
</script></body></html>
