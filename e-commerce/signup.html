<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signup · Northfield Goods</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body><div id="nav"></div>
<main class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-4"><h2 class="mb-3">Create your account</h2>
<form id="f" class="card card-body gap-3"><div><label class="form-label">Full name</label><input id="n" class="form-control" required></div>
<div><label class="form-label">Email</label><input id="e" type="email" class="form-control" required></div>
<div><label class="form-label">Password (min 6 characters)</label><input id="p" type="password" minlength="6" class="form-control" required></div><div id="err" class="text-danger small"></div><button class="btn btn-accent">Sign up</button></form>
<p class="mt-3">Already registered? <a href="login.html">Log in</a></p></div></div></main>
<div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script>
<script>
$("#f").onsubmit=e=>{e.preventDefault();const us=load("users",[]),em=$("#e").value.trim().toLowerCase();
if(us.some(u=>u.email===em)){$("#err").textContent="That email is already registered. Try logging in.";return}
const u={name:$("#n").value.trim(),email:em,pass:btoa($("#p").value)};us.push(u);save("users",us);save("session",{name:u.name,email:u.email});
const n=sessionStorage.getItem("next");sessionStorage.removeItem("next");location.href=n||"index.html"}</script></body></html>
