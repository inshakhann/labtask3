<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home · Northfield Goods</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body><div id="nav"></div>
<header class="hero"><div class="container"><h1 class="display-4 col-lg-7">Good things for the rooms you live in.</h1>
<p class="lead col-lg-6">Mugs, linen, lamps and plants chosen for how they wear, not how they trend.</p>
<a href="#products" class="btn btn-accent btn-lg">Shop the collection</a></div></header>
<main class="container py-5"><div class="d-flex flex-wrap justify-content-between align-items-center mb-3" id="products">
<h2>Products</h2><select id="filter" class="form-select w-auto"><option value="">All categories</option></select></div>
<div class="row g-4" id="grid"></div>
<h2 class="mt-5 mb-3" id="reviews">What customers say</h2><div class="row g-3" id="recent"></div></main>
<div class="modal fade" id="pm"><div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title" id="pmTitle"></h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body"><p id="pmDesc"></p><h6>Reviews</h6><div id="pmReviews" class="mb-3"></div>
<form id="rf" class="border-top pt-3"><h6>Write a review</h6><div class="row g-2">
<div class="col-md-5"><input id="rn" class="form-control" placeholder="Your name" required></div>
<div class="col-md-3"><select id="rr" class="form-select"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></div>
<div class="col-12"><textarea id="rt" class="form-control" rows="2" placeholder="Your review" required></textarea></div>
<div class="col-12"><button class="btn btn-accent">Post review</button></div></div></form></div></div></div></div>
<div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script>
<script>
const esc=s=>String(s).replace(/</g,"&lt;");
const avg=id=>{const r=getReviews().filter(x=>x.pid===id);return r.length?Math.round(r.reduce((s,x)=>s+x.rating,0)/r.length):0};
function grid(){const f=$("#filter").value;$("#grid").innerHTML=PRODUCTS.filter(p=>!f||p.cat===f).map(p=>`
<div class="col-6 col-lg-3"><div class="card h-100 product-card"><img src="${p.img}" class="card-img-top" alt="${p.name}">
<div class="card-body d-flex flex-column"><h6 class="card-title">${p.name}</h6>
<div class="star small">${stars(avg(p.id))}</div><div class="price mb-3">${money(p.price)}</div>
<div class="mt-auto d-grid gap-2"><button class="btn btn-accent btn-sm" onclick="addToCart(${p.id})">Add to cart</button>
<button class="btn btn-outline-secondary btn-sm" onclick="openP(${p.id})">Details &amp; reviews</button></div></div></div></div>`).join("")}
function recent(){$("#recent").innerHTML=getReviews().slice(0,4).map(r=>`<div class="col-md-6 col-lg-3"><div class="card h-100"><div class="card-body">
<div class="star">${stars(r.rating)}</div><p class="mb-2">${esc(r.text)}</p>
<small class="text-muted">${esc(r.name)} on ${PRODUCTS.find(p=>p.id===r.pid).name}</small></div></div></div>`).join("")}
let cur=0;
function openP(id){cur=id;const p=PRODUCTS.find(x=>x.id===id);$("#pmTitle").textContent=p.name+" · "+money(p.price);$("#pmDesc").textContent=p.desc;
const r=getReviews().filter(x=>x.pid===id);$("#pmReviews").innerHTML=r.length?r.map(x=>`<div class="mb-2"><span class="star">${stars(x.rating)}</span> <strong>${esc(x.name)}</strong><div>${esc(x.text)}</div></div>`).join(""):'<p class="text-muted">No reviews yet. Be the first.</p>';
const u=getUser();if(u)$("#rn").value=u.name;bootstrap.Modal.getOrCreateInstance($("#pm")).show()}
$("#rf").onsubmit=e=>{e.preventDefault();const r=getReviews();r.unshift({pid:cur,name:$("#rn").value,rating:+$("#rr").value,text:$("#rt").value});save("reviews",r);$("#rt").value="";openP(cur);grid();recent();toast("Review posted")};
[...new Set(PRODUCTS.map(p=>p.cat))].forEach(c=>$("#filter").insertAdjacentHTML("beforeend",`<option>${c}</option>`));
$("#filter").onchange=grid;grid();recent();
</script></body></html>
