<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login · Northfield Goods</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body><div id="nav"></div>
<main class="container py-5"><div class="row justify-content-center"><div class="col-md-6 col-lg-4"><h2 class="mb-3">Log in</h2>
<form id="f" class="card card-body gap-3"><div><label class="form-label">Email</label><input id="e" type="email" class="form-control" required></div>
<div><label class="form-label">Password</label><input id="p" type="password" class="form-control" required></div><div id="err" class="text-danger small"></div><button class="btn btn-accent">Log in</button></form>
<p class="mt-3">New here? <a href="signup.html">Create an account</a></p></div></div></main>
<div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script>
<script>
$("#f").onsubmit=e=>{e.preventDefault();const u=load("users",[]).find(x=>x.email===$("#e").value.trim().toLowerCase()&&x.pass===btoa($("#p").value));
if(!u){$("#err").textContent="Email or password is incorrect.";return}
save("session",{name:u.name,email:u.email});const n=sessionStorage.getItem("next");sessionStorage.removeItem("next");location.href=n||"index.html"}</script></body></html>
