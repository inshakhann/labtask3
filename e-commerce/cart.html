<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart · Northfield Goods</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head><body><div id="nav"></div>
<main class="container py-5"><h2 class="mb-4">Your cart</h2><div id="cart"></div></main>
<div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script>
<script>
function draw(){const c=getCart();if(!c.length){$("#cart").innerHTML='<p>Your cart is empty.</p><a class="btn btn-accent" href="index.html#products">Browse products</a>';return}
let t=0;const rows=c.map(i=>{const p=PRODUCTS.find(x=>x.id===i.id);t+=p.price*i.qty;return`<tr>
<td><div class="d-flex align-items-center gap-3"><img class="cart-img" src="${p.img}" alt=""><span>${p.name}</span></div></td>
<td>${money(p.price)}</td>
<td><div class="input-group input-group-sm" style="width:120px"><button class="btn btn-outline-secondary" onclick="chg(${p.id},-1)" aria-label="Decrease">−</button>
<input class="form-control text-center" value="${i.qty}" onchange="setq(${p.id},this.value)" aria-label="Quantity"><button class="btn btn-outline-secondary" onclick="chg(${p.id},1)" aria-label="Increase">+</button></div></td>
<td>${money(p.price*i.qty)}</td><td><button class="btn btn-sm btn-outline-danger" onclick="rm(${p.id})">Remove</button></td></tr>`}).join("");
$("#cart").innerHTML=`<div class="table-responsive"><table class="table align-middle bg-white"><thead><tr><th>Product</th><th>Price</th><th>Qty</th><th>Total</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
<div class="text-end"><h4>Subtotal: ${money(t)}</h4><a href="checkout.html" class="btn btn-accent">Go to checkout</a></div>`}
function chg(id,d){const c=getCart(),i=c.find(x=>x.id===id);i.qty+=d;setCart(i.qty<1?c.filter(x=>x.id!==id):c);draw()}
function setq(id,v){v=parseInt(v);const c=getCart();setCart(v>0?c.map(x=>x.id===id?{...x,qty:v}:x):c.filter(x=>x.id!==id));draw()}
function rm(id){setCart(getCart().filter(x=>x.id!==id));draw()}
draw();
</script></body></html>
